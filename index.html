<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Thêm vào màn hình chính → mở toàn màn hình như ứng dụng (iPhone, iPad, Android) -->
  <meta name="theme-color" content="#1D4636">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bánh Mì">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <title>Quán Bánh Mì Trà Đá</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Bungee&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="game" aria-label="Quán Bánh Mì Trà Đá"></canvas>
    <div id="fx" aria-hidden="true"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <!-- Menu chính -->
    <section id="menu" class="overlay">
      <div class="menu-grid">
        <div class="sign">
          <small data-i18n="signSmall">Quán vỉa hè</small>
          <h1 data-i18n-html="signTitle">Bánh mì<br>Trà đá</h1>
          <p data-i18n="signHours">Mở cửa 6h – 22h</p>
        </div>
        <div class="card">
          <div class="langs" role="group">
            <button type="button" class="lang" data-ui="lang" data-lang="ja" lang="ja" aria-pressed="true">日本語</button>
            <button type="button" class="lang" data-ui="lang" data-lang="vi" lang="vi" aria-pressed="false">Tiếng Việt</button>
          </div>
          <div class="modes" role="group">
            <button type="button" class="mode-tab" data-ui="gmode" data-gm="coop" data-i18n="modeCoop">Cùng bán</button>
            <button type="button" class="mode-tab vs" data-ui="gmode" data-gm="versus" data-i18n="modeVs">Bếp Chiến 2v2</button>
          </div>
          <p class="mode-desc" id="modeDesc"></p>
          <p class="best-line" id="menuBest"></p>
          <button type="button" class="btn" id="btnSolo" data-ui="solo" data-i18n="solo">Chơi 1 mình</button>
          <button type="button" class="btn alt" data-ui="create" data-i18n="createRoom">Tạo phòng online</button>
          <div class="join">
            <input id="joinCode" type="text" maxlength="5" autocomplete="off" spellcheck="false" data-i18n-ph="codePh" aria-label="Mã phòng">
            <button type="button" class="btn alt" data-ui="join" data-i18n="joinRoom">Vào phòng</button>
          </div>
          <div class="row">
            <button type="button" class="btn ghost" data-ui="creator" data-i18n="character">Nhân vật của tôi</button>
            <button type="button" class="btn ghost" data-ui="help" data-i18n="help">Cách chơi</button>
            <button type="button" class="btn ghost" id="btnSound" data-ui="sound">Âm thanh: Bật</button>
          </div>
          <p class="note" data-i18n="pcNote">Chơi bằng bàn phím máy tính · 1–4 người</p>
        </div>
      </div>
    </section>

    <!-- Hướng dẫn -->
    <section id="help" class="overlay" hidden>
      <div class="card wide">
        <h2 data-i18n="help">Cách chơi</h2>
        <ol class="steps">
          <li data-i18n-html="help1"></li>
          <li data-i18n-html="help2"></li>
          <li data-i18n-html="help3"></li>
          <li data-i18n-html="help4"></li>
          <li data-i18n-html="help5"></li>
          <li data-i18n-html="help6"></li>
        </ol>
        <h2 class="h-vs" data-i18n="helpVsTitle">Bếp Chiến 2v2</h2>
        <ol class="steps">
          <li data-i18n-html="hv1"></li>
          <li data-i18n-html="hv2"></li>
          <li data-i18n-html="hv3"></li>
          <li data-i18n-html="hv4"></li>
          <li data-i18n-html="hv5"></li>
        </ol>
        <button type="button" class="btn" data-ui="menu" data-i18n="gotIt">Đã hiểu</button>
      </div>
    </section>

    <!-- Giới thiệu trước khi chơi 1 mình -->
    <section id="intro" class="overlay" hidden>
      <div class="card wide">
        <div id="introBody" class="stack"></div>
        <div class="row">
          <button type="button" class="btn" data-ui="go" data-i18n="play">Mở hàng!</button>
          <button type="button" class="btn ghost" data-ui="menu" data-i18n="toMenu">Về menu</button>
        </div>
      </div>
    </section>

    <!-- Phòng chờ chơi online -->
    <section id="lobby" class="overlay" hidden>
      <div class="card wide lobby">
        <div class="stack">
          <p class="eyebrow" data-i18n="lobbyTitle">Phòng chơi</p>
          <div class="modes" role="group">
            <button type="button" class="mode-tab" data-ui="roomMode" data-rm="coop" data-i18n="modeCoop">Cùng bán</button>
            <button type="button" class="mode-tab vs" data-ui="roomMode" data-rm="versus" data-i18n="modeVs">Bếp Chiến 2v2</button>
          </div>
          <div class="code-row"><b id="lobbyCode" class="code">·····</b>
            <button type="button" class="btn ghost small" data-ui="copy" data-i18n="copy">Sao chép mã</button></div>
          <p class="sub" data-i18n="shareHint">Gửi mã này cho bạn bè</p>
          <ul id="lobbyList" class="players"></ul>
          <button type="button" class="btn ghost small" id="btnTeam" data-ui="team" data-i18n="teamSwitch" hidden>Đổi đội</button>
          <p class="sub" id="lobbyNote"></p>
          <button type="button" class="btn" id="btnStartRoom" data-ui="startRoom" data-i18n="start">Bắt đầu bán · 3 phút</button>
          <p class="sub center" id="lobbyWait" data-i18n="waitHost">Đang chờ chủ phòng bắt đầu…</p>
          <button type="button" class="btn ghost" data-ui="leave" data-i18n="leave">Rời phòng</button>
        </div>
        <div id="lobbyRules" class="stack"></div>
      </div>
    </section>

    <!-- Tạo / chỉnh nhân vật -->
    <section id="creator" class="overlay" hidden>
      <div class="card wide creator">
        <div class="cr-left">
          <canvas id="charPreview" class="char-preview" data-ui="turn" width="140" height="210" aria-label="Xoay nhân vật"></canvas>
          <p class="sub center" data-i18n="crTapHint">Bấm vào nhân vật để xoay</p>
        </div>
        <div class="cr-right">
          <p class="eyebrow" data-i18n="crEyebrow">Chủ quán của bạn</p>
          <label class="field" for="charName"><span data-i18n="crName">Tên nhân vật</span>
            <input id="charName" type="text" maxlength="12" autocomplete="off" spellcheck="false">
          </label>
          <p class="sub" id="charStars"></p>
          <div id="charOpts" class="cr-opts"></div>
          <button type="button" class="btn" data-ui="saveChar" data-i18n="crSave">Lưu nhân vật</button>
        </div>
      </div>
    </section>

    <!-- Tạm dừng -->
    <section id="pause" class="overlay" hidden>
      <div class="card">
        <h2 data-i18n="paused">Tạm dừng</h2>
        <button type="button" class="btn" data-ui="resume" data-i18n="resume">Chơi tiếp</button>
        <button type="button" class="btn alt" id="btnPauseRetry" data-ui="go" data-i18n="retry">Chơi lại</button>
        <button type="button" class="btn ghost" data-ui="menu" data-i18n="toMenu">Về menu</button>
      </div>
    </section>

    <!-- Kết quả -->
    <section id="result" class="overlay" hidden>
      <div class="card center" id="resultBody"></div>
    </section>

    <!-- Thông báo / đang kết nối -->
    <section id="msg" class="overlay" hidden>
      <div class="card center">
        <p id="msgText" class="msg-text"></p>
        <button type="button" class="btn" id="msgOk" data-ui="msgOk">OK</button>
      </div>
    </section>
  </div>

  <!-- Thẻ thông tin chữ to: đồ đang cầm, khu trước mặt / món khách gọi -->
  <div id="heldCard" class="pcard" hidden></div>
  <div id="lookCard" class="pcard" hidden></div>

  <!-- Điều khiển ảo trên điện thoại -->
  <div id="touch" hidden>
    <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
    <button type="button" id="btnAct" aria-label="Cầm / Đặt"><span data-i18n-html="tbAct">Cầm<br>Đặt</span><small data-i18n="tbHold">giữ: rửa bát</small></button>
    <button type="button" id="btnUse" aria-label="Tương tác / Ném"><span data-i18n-html="tbUse">Tương tác<br>Ném</span><small data-i18n="tbUseHold">giữ: thái</small></button>
    <div id="tsmall">
      <button type="button" id="btnPauseT" class="tsm" data-i18n-aria="paused" aria-label="Tạm dừng"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="11.5" y="4" width="3.5" height="12" rx="1" fill="currentColor"/></svg></button>
      <button type="button" id="btnFull" class="tsm" data-i18n-aria="fullscreen" aria-label="Toàn màn hình"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/art.js"></script>
<script src="js/chars.js"></script>
<script src="js/world.js"></script>
<script src="js/sim.js"></script>
<script src="js/versus.js"></script>
<script src="js/net.js"></script>
<script src="js/main.js"></script>
<script src="js/panels.js"></script>
<script src="js/layout.js"></script>
<script src="js/touch.js"></script>
<script src="js/screens.js"></script>
</body>
</html>
